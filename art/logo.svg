<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#262b5e"/>
      <stop offset="1" stop-color="#120f2b"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd24a"/>
      <stop offset=".55" stop-color="#ff8a3d"/>
      <stop offset="1" stop-color="#ff3d6e"/>
    </linearGradient>
    <clipPath id="c"><circle cx="128" cy="150" r="74"/></clipPath>
  </defs>
  <rect width="256" height="256" rx="58" fill="url(#bg)"/>
  <!-- radio waves -->
  <g fill="none" stroke="#2ec4b6" stroke-width="7" stroke-linecap="round">
    <path d="M86 58a30 30 0 0 1 12-34" opacity=".9"/>
    <path d="M72 64a46 46 0 0 1 16-50" opacity=".55"/>
    <path d="M170 58a30 30 0 0 0-12-34" opacity=".9"/>
    <path d="M184 64a46 46 0 0 0-16-50" opacity=".55"/>
  </g>
  <!-- Y antenna -->
  <g stroke="#eef0ff" stroke-width="8" stroke-linecap="round" fill="none">
    <path d="M128 78V56L108 34M128 56l20-22"/>
  </g>
  <circle cx="108" cy="34" r="7" fill="#f7c548"/>
  <circle cx="148" cy="34" r="7" fill="#f7c548"/>
  <!-- sun -->
  <circle cx="128" cy="150" r="74" fill="url(#sun)"/>
  <!-- beat / equalizer skyline -->
  <g clip-path="url(#c)" fill="#161436">
    <rect x="60"  y="170" width="14" height="60" rx="4"/>
    <rect x="80"  y="146" width="14" height="90" rx="4"/>
    <rect x="100" y="118" width="14" height="120" rx="4"/>
    <rect x="121" y="96"  width="14" height="140" rx="4"/>
    <rect x="142" y="126" width="14" height="110" rx="4"/>
    <rect x="162" y="152" width="14" height="80" rx="4"/>
    <rect x="182" y="176" width="14" height="60" rx="4"/>
  </g>
  <rect x="44" y="220" width="168" height="8" rx="4" fill="#eef0ff" opacity=".9"/>
</svg>
