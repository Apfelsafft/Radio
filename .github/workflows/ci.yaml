name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy scipy aiohttp pytest
      - run: pytest -q tests

  lint-addon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: frenck/action-addon-linter@v2
        with:
          path: "./yapaia_beat"

  build:
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4
      - name: Build add-on image (amd64)
        run: |
          docker build \
            --build-arg BUILD_FROM=ghcr.io/home-assistant/amd64-base-debian:bookworm \
            --build-arg BUILD_VERSION=ci \
            -t yapaia-beat:ci yapaia_beat
      - name: Smoke test
        run: |
          docker run --rm --entrypoint "" -e YAPAIA_DATA=/tmp yapaia-beat:ci \
            bash -c 'welle-cli -v; redsea --version; timeout 5 python3 -m yapaia || test $? -eq 124'
